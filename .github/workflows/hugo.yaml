name: Deploy Hugo site to Vercel Source
on:
  push:
    branches: ["main"]

permissions:
  contents: write  # 必须，用于推送 gh-pages 分支

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.154.0'
          extended: true

      - name: Build
        run: hugo --minify --environment production
      
      # 核心：只负责把 public 文件夹的内容推送到 gh-pages 分支
      # Vercel 会在检测到该分支变动后自动抓取
      - name: Push to gh-pages branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: true # 如果是为了 Vercel，建议设为 true，保持分支干净
