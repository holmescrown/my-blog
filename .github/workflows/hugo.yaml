# 基础配置
baseURL: "https://my-blog-seven-pi-27.vercel.app/"
title: "我的博客"
theme: "hugo-theme-stack"
languageCode: "zh-cn"

# ---------------------------------------------------------
# 关键修复方案：解决 GetRemote 图片超时及模板 Height 报错
# ---------------------------------------------------------
params:
    # 针对 hugo-theme-stack 的核心配置
    imageProcessing:
        content:
            enabled: false # 禁用内容图片处理，防止因下载失败导致 Height 报错
        cover:
            enabled: true  # 封面图如果也是远程的，建议也设为 false

# 安全配置：允许 Hugo 获取远程资源（虽然我们禁用了处理，但保留基础访问权限）
security:
  http:
    methods: [GET]
    urls: ['.*'] # 允许匹配所有 URL

# ---------------------------------------------------------
# 其他推荐配置
# ---------------------------------------------------------
markup:
  goldmark:
    renderer:
      unsafe: true # 允许在 Markdown 中使用 HTML
