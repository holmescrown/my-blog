name: Deploy Hugo site to Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Force Install Hugo 0.154.0
        run: |
          # 1. 下载指定的 0.154.0 扩展版二进制包
          curl -L https://github.com/gohugoio/hugo/releases/download/v0.154.0/hugo_extended_0.154.0_linux-amd64.tar.gz -o hugo.tar.gz
          
          # 2. 解压
          tar -xzf hugo.tar.gz
          
          # 3. 强制覆盖系统默认的 hugo 命令路径
          sudo chmod +x hugo
          sudo mv hugo /usr/local/bin/hugo
          
          # 4. 打印版本确认，如果这里不是 0.154.0，脚本会立即中断报错
          hugo version

      - name: Build with Hugo
        # 使用刚刚强制安装的路径运行
        run: /usr/local/bin/hugo --minify --environment production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
