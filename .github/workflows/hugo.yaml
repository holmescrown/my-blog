name: Deploy Hugo site to gh-pages
on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # 关键步骤：用官方工具强制安装指定版本，它会自动处理 PATH 优先级
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.154.0'
          extended: true # 必须开启，Stack 主题需要处理 SCSS

      - name: Build
        # 使用特定的构建命令，确保生产环境路径正确
        run: hugo --minify --environment production

      # 只推送 gh-pages 分支，供 Vercel 抓取
      - name: Push to gh-pages branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: true # 保持分支只有静态文件，减小 Vercel 读取压力
