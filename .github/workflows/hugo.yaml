name: Deploy Hugo site to Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Force Install Hugo Extended 0.154.0
        run: |
          # 绕过所有插件，直接从官方下载 Linux 64位扩展版
          wget https://github.com/gohugoio/hugo/releases/download/v0.154.0/hugo_extended_0.154.0_linux-amd64.tar.gz
          tar -xzf hugo_extended_0.154.0_linux-amd64.tar.gz
          # 强制替换系统路径里的 hugo
          sudo mv hugo /usr/local/bin/hugo
          # 验证版本，如果不显示 0.154.0 这一步就会直接报错停止
          hugo version | grep "v0.154.0"

      - name: Build with Hugo
        run: hugo --minify --environment production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
