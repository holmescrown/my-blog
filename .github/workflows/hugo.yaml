name: Deploy to gh-pages
on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Force Install Hugo 0.154.0
        run: |
          curl -L https://github.com/gohugoio/hugo/releases/download/v0.154.0/hugo_extended_0.154.0_linux-amd64.tar.gz -o hugo.tar.gz
          tar -xzf hugo.tar.gz
          chmod +x ./hugo

      - name: Build
        # 使用 ./hugo 强制调用新版本
        run: ./hugo --minify

      - name: Push to gh-pages branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: true
