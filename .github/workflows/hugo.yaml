name: Deploy Hugo site to Pages
on:
  push:
    branches: ["main"]
permissions:
  contents: write    # 必须从 read 改为 write，否则没法创建 gh-pages 分支
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Force Download Hugo 0.154.0
        run: |
          curl -L https://github.com/gohugoio/hugo/releases/download/v0.154.0/hugo_extended_0.154.0_linux-amd64.tar.gz -o hugo.tar.gz
          tar -xzf hugo.tar.gz
          sudo mv hugo /usr/bin/hugo
          hugo version
      - name: Build
        run: hugo --minify --environment production
      
      # 这一步是为了让 Vercel 能够找到 Production Branch
      - name: Push to gh-pages branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages

      - name: Upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public
  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        uses: actions/deploy-pages@v4
