- name: Force Overwrite and Execute
        run: |
          # 1. 强行下载并解压到当前根目录
          curl -L https://github.com/gohugoio/hugo/releases/download/v0.154.0/hugo_extended_0.154.0_linux-amd64.tar.gz -o hugo_bundle.tar.gz
          tar -xzf hugo_bundle.tar.gz
          
          # 2. 物理删除系统可能存在的旧版残留（以防万一）
          # 我们不移动它，我们直接在这个路径下给它改名并执行
          chmod +x ./hugo
          
          # 3. 【核心中的核心】用绝对路径运行当前目录下的这个二进制文件
          # 这样即便 PATH 里有 100 个旧版 Hugo，也绝对影响不到这一行
          ./hugo --minify --environment production --source . --destination public
