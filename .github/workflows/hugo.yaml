name: Deploy Hugo site to Pages

on:
  push:
    branches: ["main"]

# 确保 Action 有权将生成的网页推送到 Pages 服务
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive # 自动拉取主题子模块
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          # 必须使用 0.154.0 或更高版本以匹配 hugo-theme-stack 的要求
          hugo-version: '0.154.0' 
          extended: true

      - name: Build with Hugo
        # 加上 --environment production 确保以生产模式构建
        run: hugo --minify --environment production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
